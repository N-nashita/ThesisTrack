spring.application.name=thesistrack
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/thesistrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.admin.email=${ADMIN_EMAIL:admin@thesistrack.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
server.port=${PORT:8081}
app.jwt.secret=${JWT_SECRET:thesistrack-demo-secret-key-change-me-0123456789}
app.jwt.expiration-ms=86400000
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

