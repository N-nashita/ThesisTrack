<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>ThesisTrack Login</title></head>
<body>
<h2>ThesisTrack Login</h2>
<p th:if="${param.error}" style="color:red">Invalid email or password</p>
<p th:if="${param.logout}" style="color:green">You have been logged out</p>
<form th:action="@{/login}" method="post">
    <input type="email" name="username" placeholder="Email" required><br>
    <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>
</body>
</html>
