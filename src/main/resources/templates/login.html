<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<div class="login-box card">
    <h1 style="text-align:center">📘 ThesisTrack</h1>
    <p class="muted" style="text-align:center">Thesis Progress Tracking System</p>
    <div class="alert err" th:if="${param.error}">Invalid email or password</div>
    <div class="alert ok" th:if="${param.logout}">You have been logged out</div>
    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit" style="width:100%">Login</button>
    </form>
</div>
</body>
</html>
